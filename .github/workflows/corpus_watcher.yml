name: corpus-watcher
# The drift product's engine — free, on a cron. Polls authorities, re-hashes provisions, emits drift events.
on:
  schedule:
    - cron: '11 3 * * *'        # daily 03:11 UTC (low-traffic window)
  workflow_dispatch: {}          # manual trigger for testing
permissions:
  contents: write                # to commit updated corpus hashes + drift events back to the repo (portable state = Git)
jobs:
  watch:
    runs-on: ubuntu-latest       # CPU only — no GPU needed
    timeout-minutes: 20          # short by design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: watch EU AI Act (EUR-Lex CELLAR, 113 articles)
        run: python watcher/run_watch.py --authority eur-lex --subset ai-act-113 --out drift_events.jsonl
      - name: watch EU CRA (EUR-Lex CELLAR, 71 articles)
        run: python watcher/run_watch.py --authority eur-lex --subset cra-articles --out drift_events.jsonl
      - name: watch UK GDPR (legislation.gov.uk, core articles)
        run: python watcher/run_watch.py --authority legislation.uk --subset uk-gdpr-core --out drift_events.jsonl
      - name: watch DPA 2018 (legislation.gov.uk, ss.1-3)
        run: python watcher/run_watch.py --authority legislation.uk --subset dpa-2018-s123 --out drift_events.jsonl
      - name: watch NIS Regulations (legislation.gov.uk, core regs)
        run: python watcher/run_watch.py --authority legislation.uk --subset nis-regs-core --out drift_events.jsonl
      - name: generate signed delta report
        env:
          CORPUS_SIGN_KEY: ${{ secrets.CORPUS_SIGN_KEY }}
        run: python scripts/delta_report.py --events drift_events.jsonl --state corpus_state.json --outdir reports --key "$CORPUS_SIGN_KEY"
      - name: emit watcher status snapshot
        env:
          CORPUS_SIGN_KEY: ${{ secrets.CORPUS_SIGN_KEY }}
        run: python scripts/status.py --state corpus_state.json --events drift_events.jsonl --key "$CORPUS_SIGN_KEY" > reports/status.json
      - name: commit corpus + drift deltas + reports
        run: |
          git config user.name  "corpus-watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add corpus_state.json drift_events.jsonl reports/ || true
          git commit -m "corpus watch $(date -u +%FT%TZ)" || echo "no change"
          git push || echo "nothing to push"
