name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt pytest==8.*
      - name: offline tests (fail-closed guards, committed inputs re-hash)
        run: pytest -q
      - name: obligation fixtures
        run: PYTHONPATH=. python -m spine.pipeline --selftest
